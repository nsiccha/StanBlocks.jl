        if (!('htmxoGroup' in row.dataset)) {
            tally('htmxoLeaf' in row.dataset ? 'leaf:' + row.dataset.htmxoLeaf : row, visible.has(row), rejectedBy.get(row));
            return;
        }
        const leaves = htmxoLazyLeaves(row);
        if (!leaves.length) return;
        const kept = visible.has(row), path = [ownText(row).toLocaleLowerCase()];
        for (let r = byId.get(row.dataset.htmxoParent); r; r = byId.get(r.dataset.htmxoParent)) path.unshift(text(r));
        // The unloaded leaves this pass hides, for hover linking.
        row.htmxoLazyFiltered = new Set();
        leaves.forEach(([key, t]) => {
            const ctx = {query, input: raw, text: (path.join(' ') + ' ' + t.toLocaleLowerCase()).replace(/\s+/g, ' ')};
            const shown = kept && search(row, ctx);
            if (!shown) row.htmxoLazyFiltered.add(key);
            tally('leaf:' + key, shown, kept ? 'search' : rejectedBy.get(row));
        });
    });
    // hiddenBy counts the hidden items per predicate that first rejected
    // them; listeners may push short notes that the count line appends.
    const hiddenBy = {};
    let shown = 0;
    items.forEach(item => { if (item.shown) shown++; else hiddenBy[item.by] = (hiddenBy[item.by] || 0) + 1; });
    const detail = {shown, total: items.size, query, hiddenBy, notes: []};
    root.dispatchEvent(new CustomEvent('htmxo:table-filtered', {bubbles: true, detail}));
    const count = root.querySelector(':scope > .htmxo-table-toolbar > label > [data-htmxo-table-count]');
    if (count) count.textContent = htmxoText(root, 'count', {shown: detail.shown, total: detail.total}) +
        detail.notes.map(note => ' · ' + note).join('');
    root.querySelector(':scope > [data-htmxo-table-empty]').hidden = visible.size !== 0;
}

// "Expand all" / "Collapse all": every collapsible branch, or, while a
// search is active, the matching paths (see `htmxoFilterTable`).
function htmxoTreeAll(button, open) {
    const root = htmxoSearchRoot(button);
    const input = root.querySelector(':scope > .htmxo-table-toolbar > label > input[type="search"]');
    const searching = Boolean(input && input.value.trim());
    if (searching) {
        if (open) delete root.dataset.htmxoSearchCollapsed;
        else root.dataset.htmxoSearchCollapsed = '';
    } else {
        root.querySelector('table').tBodies[0].querySelectorAll(':scope > tr[data-htmxo-tree-open]')
            .forEach(r => { r.dataset.htmxoTreeOpen = String(open); htmxoTreeRemember(r); });
    }
    if (open) root.querySelector('table').tBodies[0].querySelectorAll(':scope > tr[data-htmxo-lazy-rows]')
        .forEach(r => htmxoLoadRows(r, !searching));
    htmxoFilterTable(root);
}

// A branch rendered with `data-htmxo-lazy-rows` fetches its rows on first
// expand: the response's <tbody data-htmxo-group-rows> rows go in after the
// branch row, then the current sort, search and selection apply to them.
// With `expand` (Expand all), the branches among them open as well, and the
// lazy ones load in turn.
function htmxoLoadRows(row, expand) {
    if (row.htmxoLoading) return row.htmxoLoading;
    row.setAttribute('aria-busy', 'true');
    row.htmxoLoading = fetch(row.dataset.htmxoLazyRows, {headers: {'HX-Request': 'true'}})
        .then(r => r.ok ? r.text() : Promise.reject(new Error(htmxoText(row, 'rows_failed', {status: r.status}))))
        .then(html => {
            const template = document.createElement('template');
            template.innerHTML = html;
            const body = template.content.querySelector('tbody[data-htmxo-group-rows]');
            if (!body) throw new Error(htmxoText(row, 'rows_missing'));
            const rows = Array.from(body.rows);
            const wrapper = row.closest('[data-htmxo-group-scope]');
            if (wrapper) htmxoRescope(rows, body.dataset.htmxoGroupScope, wrapper.dataset.htmxoGroupScope);
            row.after(...rows);
            ['htmxoLazyRows', 'htmxoLazyLeaves', 'htmxoSelectMembers'].forEach(k => delete row.dataset[k]);
            delete row.htmxoMembers;
            row.removeAttribute('aria-busy');
            row.querySelector('[data-htmxo-tree-toggle]').setAttribute('aria-controls',
                rows.filter(r => r.dataset.htmxoParent === row.id).map(r => r.id).join(' '));
            if (window.htmx) rows.forEach(r => htmx.process(r));
            row.dataset.htmxoTreeOpen = 'true';
            htmxoTreeRemember(row);
            if (expand) rows.forEach(r => {
                if ('htmxoLazyRows' in r.dataset) htmxoLoadRows(r, true);
                else if ('htmxoTreeOpen' in r.dataset) { r.dataset.htmxoTreeOpen = 'true'; htmxoTreeRemember(r); }
            });
            htmxoResort(row.closest('table'));
            htmxoFilterTable(row);
        })
        .catch(err => {
            row.removeAttribute('aria-busy');
            row.htmxoLoading = null;
            if (window.htmxoToast) window.htmxoToast(err.message, 'error');
        });
    return row.htmxoLoading;
}

// Re-apply the table's current client-side sort (after rows were added).
function htmxoResort(table) {
    const th = table.querySelector('thead th[data-sort-dir]');
    if (!th) return;
    th.dataset.sortDir = th.dataset.sortDir === 'asc' ? 'desc' : 'asc';
    sortTable(th);
}

function htmxoTreeToggle(button) {
    const row = button.closest('tr');
    if ('htmxoLazyRows' in row.dataset) { htmxoLoadRows(row); return; }
    row.dataset.htmxoTreeOpen = row.dataset.htmxoTreeOpen === 'true' ? 'false' : 'true';
    htmxoTreeRemember(row);
    // Hierarchical tables always have a search scaffold, even when its field
    // is hidden. One visibility pass owns both collapse and filtering.
    htmxoFilterTable(row);
}
function htmxoTreeRow(row, event) {
    if (htmxoRowControl(row, event.target)) return;
    const button = row.querySelector('[data-htmxo-tree-toggle]');
    if (button && !button.disabled) htmxoTreeToggle(button);
}

// --- Row updates: `master_detail_table(...; update_rows, update_groups)` ---
// An action route answers with the rows it changed, rendered by the table's
// own call: a <tbody data-htmxo-row-update>. Each row replaces its namesake
// in place and keeps what the user did to it (open branch and detail,
// selection, search, focus) but takes the update's content, its detail's
// too, except elements marked hx-preserve (below); a leaf that moves to
// another group takes its open detail and the focus along, its new groups
// opening if the reader had it open in view; a row new to the table, or
// whose place among its siblings changed, goes where the table's own render
// puts it, unless its group is not loaded, and a sorted table re-applies its
// sort; a row in the update's scope that it no longer lists leaves, with its
// detail and child rows. The group rows a browser regroup asks for
// (`group_masters`) replace the browser's and leave the leaf rows alone. Any
// htmx response holding such a body is applied this way, whatever the
// requesting element's hx-target, and a poller that answer ends leaves with
// the target as it was; `htmxoUpdateRows(html)` applies one fetched by other
// means.
function htmxoUpdateRows(update, origin) {
    if (typeof update === 'string') {
        const template = document.createElement('template');
        template.innerHTML = update;
        update = template.content.querySelector('tbody[data-htmxo-row-update]');
    }
    if (!update) throw new Error('htmxoUpdateRows: no <tbody data-htmxo-row-update> to apply');
    const isDetail = r => r.id.startsWith('detail-');
    const detailId = r => 'detail-' + r.id.slice(r.id.indexOf('-') + 1);
    const incoming = Array.from(update.rows);
    const list = name => JSON.parse(update.getAttribute(name) || '[]');
    const ids = new Set(list('data-htmxo-update-ids'));
    const leaves = new Set(list('data-htmxo-update-leaves'));
    const groups = new Set(list('data-htmxo-update-groups'));
    // The table: by its body id, else the one holding a row the update
    // names, else the one around the element that asked for it.
    const bodyOf = id => { const el = id && document.getElementById(id); return el && el.parentElement && el.parentElement.tagName === 'TBODY' ? el.parentElement : null; };
    let tbody = update.dataset.htmxoRowUpdate ? document.getElementById(update.dataset.htmxoRowUpdate) : null;
    const named = [...incoming.flatMap(r => [r.id, r.dataset.htmxoParent]), ...ids, ...groups];
    for (let i = 0; !tbody && i < named.length; i++) tbody = bodyOf(named[i]);
    // The element that asked may sit beside the table, in its toolbar (the
    // hidden element asking for `group_masters`).
    if (!tbody && origin && origin.closest) {
        const around = origin.closest('[data-htmxo-grouped]');
        const t = origin.closest('table') || (around && around.querySelector('table'));
        tbody = t && t.tBodies[0];
    }
    // The group rows of a browser regroup (`group_masters`) have nothing to
    // do once their table has left the page, or the reader has regrouped
    // again: they are dropped, quietly.
    const groupMasters = 'htmxoGroupMasters' in update.dataset;
    if (!tbody && groupMasters) return;
    if (!tbody) throw new Error('htmxoUpdateRows: no table on the page holds these rows');
    // Rows rendered for another grouping than the table shows would land
    // under the wrong groups: refuse them.
    if ('htmxoGrouped' in update.dataset) {
        const wrapper = tbody.closest('[data-htmxo-grouped]');
        const shown = wrapper ? wrapper.dataset.htmxoGrouped : null;
        if (shown !== update.dataset.htmxoGrouped && groupMasters) return;
        if (shown !== update.dataset.htmxoGrouped) throw new Error('htmxoUpdateRows: the rows are grouped by ' +
            JSON.stringify(update.dataset.htmxoGrouped) + ' but the table by ' + JSON.stringify(shown));
    }

    // change brought keeps its place in the next regroup in the browser.
    if ('htmxoGroupOrder' in update.dataset) {
        const wrapper = tbody.closest('[data-htmxo-regroup]');
        if (wrapper) {
            const cfg = JSON.parse(wrapper.dataset.htmxoRegroup);
            cfg.order = JSON.parse(update.dataset.htmxoGroupOrder);
            wrapper.dataset.htmxoRegroup = JSON.stringify(cfg);
        }
    }
    // Group rows rendered under another name than the table's (a table
    // without an id whose leaves changed since it was rendered) take the
    // table's name, and so do the groups the update speaks for and the
    // siblings it places rows between.
    if ('htmxoGroupScope' in update.dataset) {
        const wrapper = tbody.closest('[data-htmxo-group-scope]');
        if (wrapper) {
            const rename = htmxoRescope(incoming, update.dataset.htmxoGroupScope, wrapper.dataset.htmxoGroupScope);
            const renamed = [...groups].map(rename);
            groups.clear();
            renamed.forEach(g => groups.add(g));
            const placed = update.getAttribute('data-htmxo-update-places');
            if (placed) update.setAttribute('data-htmxo-update-places', JSON.stringify(Object.fromEntries(
                Object.entries(JSON.parse(placed)).map(([id, around]) => [rename(id), around.map(rename)]))));
        }
    }
    const table = tbody.closest('table');
    const masters = () => Array.from(tbody.rows).filter(r => !isDetail(r));
    const byId = new Map(masters().map(r => [r.id, r]));
    const own = id => { const el = document.getElementById(id); return el && el.parentElement === tbody ? el : null; };
    const under = (r, set) => { for (let p = r; p; p = byId.get(p.dataset.htmxoParent)) if (set.has(p.id)) return true; return false; };
    const parentOf = r => r.dataset.htmxoParent || '';
    const detailOpen = r => Boolean(own(detailId(r))) && (r.dataset.htmxoDetailOpen ?? r.getAttribute('aria-expanded')) === 'true';
    // A row the reader has open in view: shown, with its detail open.
    const openInView = r => !r.hidden && detailOpen(r);
    // Focus in a row being replaced returns to the same control (or the row)
    // in its replacement, in the row itself or in its detail.
    const active = document.activeElement;
    let focusRow = active && active.closest ? active.closest('tr') : null;
    while (focusRow && focusRow.parentElement !== tbody) focusRow = focusRow.parentElement && focusRow.parentElement.closest('tr');
    const focusMaster = focusRow && isDetail(focusRow) ? masters().find(m => detailId(m) === focusRow.id) : focusRow;
    const focus = focusRow ? {id: (focusMaster || focusRow).id, inDetail: Boolean(focusMaster) && focusMaster !== focusRow,
        index: htmxoFocusables(focusRow).indexOf(active)} : null;
    // Rows of the scope that the update no longer lists leave, with their
    // detail rows and child rows; their parents' toggles name fewer rows.
    const listed = new Set(incoming.filter(r => !isDetail(r)).map(r => r.id));
    const scoped = r => ids.has(r.id) || ('htmxoLeaf' in r.dataset && leaves.has(r.dataset.htmxoLeaf)) || under(r, groups);
    const removed = new Set(masters().filter(r => scoped(r) && !listed.has(r.id)).map(r => r.id));
    const doomed = masters().filter(r => under(r, removed));
    const touched = new Set(doomed.map(r => byId.get(r.dataset.htmxoParent)).filter(p => p && !under(p, removed)));
    // A leaf that moves to another group leaves as one row and arrives as
    // another (a leaf's row id names its group): what the reader did to the
    // copy that leaves goes to the copy that arrives.
    const leaving = new Map();
    doomed.forEach(r => {
        if (!('htmxoLeaf' in r.dataset)) return;
        const was = leaving.get(r.dataset.htmxoLeaf) || {open: false, inView: false, focus: false};
        leaving.set(r.dataset.htmxoLeaf, {open: was.open || detailOpen(r), inView: was.inView || openInView(r),
            focus: was.focus || (focus !== null && focus.id === r.id)});
    });
    const details = new Map(incoming.filter(isDetail).map(r => [r.id, r]));
    // hx-preserve, as htmx's own swaps honour it: an element of the update
    // marked hx-preserve, with an id, gives way to the page's element of that
    // id, moved with its state (a <details> the reader opened, content loaded
    // into it, what was typed). A lazy detail loads again, so the preserved
    // elements of the content it had wait in it, hidden, for that load's swap
    // to claim them; a moved leaf's go to its first new copy (as `handed`
    // below). Meanwhile they stay off the rows that leave.
    const claimed = new Map(), parked = new Map();
    incoming.forEach(r => htmxoPreservedIn(r).forEach(p => {
        const el = document.getElementById(p.id);
        if (el && !claimed.has(el) && !update.contains(el) && !el.contains(tbody)) claimed.set(el, p);
    }));
    const handOver = (from, to) => {
        if (from && to && to.querySelector('.htmxo-md-detail-slot'))
            htmxoPreservedIn(from).forEach(el => { if (!claimed.has(el)) parked.set(el, to); });
    };
    const arriving = new Map();
    incoming.forEach(r => {
        if (isDetail(r)) return;
        if (byId.has(r.id)) handOver(own(detailId(byId.get(r.id))), details.get(detailId(r)));
        else if ('htmxoLeaf' in r.dataset && !arriving.has(r.dataset.htmxoLeaf)) arriving.set(r.dataset.htmxoLeaf, details.get(detailId(r)));
    });
    doomed.forEach(r => { if ('htmxoLeaf' in r.dataset) handOver(own(detailId(r)), arriving.get(r.dataset.htmxoLeaf)); });
    const held = htmxoPreserveHold([...claimed.keys(), ...parked.keys()]);
    doomed.forEach(r => {
        const d = own(detailId(r));
        htmxoRowDiscard(r);
        if (d) htmxoRowDiscard(d);
        byId.delete(r.id);
    });
    // The last row of `r` with its detail and child rows.
    const end = r => {
        const self = new Set([r.id]);
        let last = r;
        for (let n = r.nextElementSibling; n && (isDetail(n) || under(n, self)); n = n.nextElementSibling) last = n;
        return last;
    };
    // Where the full table has each row among its siblings: the update names
    // the siblings around each row whose preceding sibling it does not list
    // ('' at either end); any other row follows the listed one before it.
    const places = JSON.parse(update.getAttribute('data-htmxo-update-places') || '{}');
    const lastListed = new Map();
    const placeOf = row => {
        const prev = lastListed.get(parentOf(row));
        lastListed.set(parentOf(row), row.id);
        return places[row.id] || (prev ? [prev, null] : null);
    };
    // Move a row, with its detail and child rows, there: after the sibling
    // before it, else first, else before the sibling after it. With neither
    // sibling on the page the row stays where it is.
    const place = (row, [prev, next]) => {
        const sibling = id => { const r = id ? byId.get(id) : null; return r && r !== row && parentOf(r) === parentOf(row) ? r : null; };
        const parent = byId.get(parentOf(row));
        let after = sibling(prev), before = null;
        if (after) after = end(after);
        else if (prev === '') { after = parent ? own(detailId(parent)) || parent : null; if (!after) before = tbody.firstElementChild; }
        else if (!(before = sibling(next))) return false;
        const block = [];
        for (let n = row, last = end(row); n; n = n === last ? null : n.nextElementSibling) block.push(n);
        if (after ? after.nextElementSibling === row : before === row || block[block.length - 1].nextElementSibling === before) return false;
        if (after) after.after(...block); else before.before(...block);
        return true;
    };
    const fresh = [];
    // The rows to keep in view, with whether to open their detail; the row
    // the focus returns to, and whether it moved to another group.
    const follow = [];
    let focusTo = focus && focus.id, focusMoved = false;
    const incomingById = new Map(incoming.map(r => [r.id, r]));
    incoming.filter(r => !isDetail(r)).forEach(row => {
        const detail = details.get(detailId(row)) || null;
        const old = byId.get(row.id);
        const at = placeOf(row);
        // The copy a moved leaf arrives as (the first, for a leaf listed in
        // several groups) takes its open detail and the focus, and stays in
        // view if the reader had the leaf open in view.
        const handed = !old && 'htmxoLeaf' in row.dataset ? leaving.get(row.dataset.htmxoLeaf) : null;
        if (handed) {
            leaving.delete(row.dataset.htmxoLeaf);
            if (handed.inView) follow.push({id: row.id, open: handed.open});
            if (handed.focus) { focusTo = row.id; focusMoved = true; }
        }
        if (old) {
            const oldDetail = own(detailId(old));
            // So does a row that moves to another parent (in a tree).
            if (parentOf(old) !== parentOf(row)) {
                if (openInView(old)) follow.push({id: row.id, open: true});
                if (focusTo === row.id) focusMoved = true;
            }
            htmxoCarryRow(old, row, oldDetail, detail);
            old.before(row);
            if (detail) row.after(detail);
            htmxoRowDiscard(old);
            if (oldDetail) htmxoRowDiscard(oldDetail);
        } else {
            const parentId = row.dataset.htmxoParent;
            const parent = parentId ? byId.get(parentId) : null;
            // A row whose group is not on the page, or not loaded, waits for it.
            if (parentId && (!parent || 'htmxoLazyRows' in parent.dataset)) return;
            const last = parent ? end(parent) : tbody.lastElementChild;
            if (last) last.after(row); else tbody.append(row);
            if (detail) row.after(detail);
            if (handed && handed.open && detail) htmxoMdShow(row, detail, true);
        }
        byId.set(row.id, row);
        const shifted = Boolean(at) && place(row, at);
        if (!old || shifted) { const parent = byId.get(parentOf(row)); if (parent) touched.add(parent); }
        touched.add(row);
        fresh.push(row);
        if (detail) fresh.push(detail);
    });
    htmxoPreservePlace(held, claimed, parked);
    // The new rows are htmx content like any swapped in: processed, then
    // announced with htmx:load (the table's own restore runs once, below).
    if (window.htmx) {
        fresh.forEach(el => htmx.process(el));
        window.htmxoRowsUpdating = true;
        try { fresh.forEach(el => htmx.trigger(el, 'htmx:load')); } finally { window.htmxoRowsUpdating = false; }
    }
    // A sorted table re-applies its sort to the rows the update placed or
    // changed, before focus returns (moving a row drops its focus).
    if (fresh.length) htmxoResort(table);
    htmxoTallyScale(table);
    // A branch toggle names the child rows the branch now has.
    const kidsOf = new Map();
    if (touched.size) masters().forEach(r => {
        const p = r.dataset.htmxoParent;
        if (p) { if (!kidsOf.has(p)) kidsOf.set(p, []); kidsOf.get(p).push(r.id); }
    });
    touched.forEach(b => {
        const toggle = b.isConnected && b.querySelector(':scope > td [data-htmxo-tree-toggle]');
        if (!toggle) return;
        const kids = kidsOf.get(b.id) || [];
        if (kids.length) toggle.setAttribute('aria-controls', kids.join(' '));
        else toggle.removeAttribute('aria-controls');
    });
    // A row kept in view opens the groups above it, outermost first; at a
    // group that has not loaded its rows the rest waits for them (below).
    const parentId = id => { const r = byId.get(id) || incomingById.get(id); return r ? parentOf(r) : ''; };
    const above = id => { const path = []; for (let p = parentId(id); p; p = parentId(p)) path.unshift(p); return path; };
    const openGroup = r => { if (r.dataset.htmxoTreeOpen === 'false') { r.dataset.htmxoTreeOpen = 'true'; htmxoTreeRemember(r); } };
    const later = follow.filter(f => {
        for (const p of above(f.id)) {
            const r = own(p);
            if (!r) return false;
            if ('htmxoLazyRows' in r.dataset) return true;
            openGroup(r);
        }

    });
    const root = tbody.closest('.htmxo-searchable-table');
    const select = tbody.closest('[data-htmxo-select]');
    const ownRoot = root && root.querySelector('table') === table, ownSelect = select && select.querySelector('table') === table;
    // The focus returns below, once the rows show, in place of the
    // selection's return to the row (noted as its row left).
    if (focus && ownSelect) htmxoSelectionOf(select).refocus = null;
    if (ownRoot) htmxoFilterTable(root);
    else if (ownSelect) htmxoSelectionUpdate(select);
    fresh.forEach(d => { if (isDetail(d) && !d.hidden) htmxoLoadSlot(d.querySelector('[data-loaded]')); });
    // To the same control, in the row's replacement or in the copy a moved
    // leaf arrived as, scrolled into view if it moved to another group; while
    // that control is not there (a lazy detail loads again), to the row or its
    // detail control; while the row does not show, to the nearest group row
    // above it that does.
    const lost = () => !document.activeElement || document.activeElement === document.body;
    const shown = el => Boolean(el) && el.getClientRects().length > 0;
    const focusAt = (id, scroll) => {
        const row = own(id);
        const holder = row && (focus.inDetail ? own(detailId(row)) : row);
        let target = holder && (focus.index >= 0 ? htmxoFocusables(holder)[focus.index] : holder.hasAttribute('tabindex') ? holder : null);
        for (let r = row, rid = id; !shown(target) && rid; rid = parentId(rid), r = own(rid)) {
            target = !shown(r) ? null : r.hasAttribute('tabindex') ? r :
                (r === row && r.querySelector('[data-htmxo-detail-toggle]')) || r.querySelector('[data-htmxo-tree-toggle]');
        }
        if (!shown(target)) return null;
        target.focus({preventScroll: true});
        if (scroll) target.scrollIntoView({block: 'nearest'});
        return target;
    };
    const placed = focus && lost() ? focusAt(focusTo, focusMoved) : null;
    later.forEach(f => (async () => {
        for (const p of above(f.id)) {
            const r = own(p);
            if (!r) return;
            if ('htmxoLazyRows' in r.dataset) await htmxoLoadRows(r);
            else openGroup(r);
        }
        const row = own(f.id), d = row && own(detailId(row));
        if (!row) return;
        if (d && f.open) htmxoMdShow(row, d, true);
        if (ownRoot) htmxoFilterTable(root);
        if (focusTo === f.id && (lost() || (placed && document.activeElement === placed))) focusAt(f.id, true);
    })());
}

// What a replaced row keeps from the one it replaces: the state the user
// gave it, which the server does not know.
