name: Run tests

on:
  workflow_dispatch:
  push:
    branches:
      # `devibe` is the ACTIVE development branch and is 217 commits ahead of
      # `dev`. Without it here, every push for the last two months went to a
      # branch this workflow does not watch — the last run was 2026-05-12, which
      # reads as "CI is fine" when it means "CI never ran". `master` dropped:
      # the repo has no such branch (default is `main`).
      - main
      - dev
      - devibe
  pull_request:
    types: [opened, edited]

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

# Two jobs, because the suite splits cleanly in two and the halves have very
# different costs (decision `1t5p8ee`):
#
#   `transpile` — everything except `:bridgestan` and `:stanc`: the portable
#     Julia/tracing suite, with no external Stan binary or C++ toolchain. Cheap
#     enough for all three OSes x all three Julia versions.
#   `stan` — the full suite, including the 27 items that call
#     `instantiate`/`compiles` and therefore drive BridgeStan's C++ build.
#     It also covers every `:stanc` item. Real coverage of emission -> stanc
#     acceptance -> log-density, which is the half most likely to break.
#     ubuntu-only, and cached.
#
# Splitting them is what `--skip-tag` was added for: `--tag` is an AND-selection
# and cannot express "everything except X".
#
# `:bridgestan` and `:stanc` are LOAD-BEARING for this split — they decide which
# items the cross-platform job skips. If you add an item that calls
# `instantiate`/`compiles`, tag it `:bridgestan`; if it invokes `stanc_check`,
# tag it `:stanc`. Otherwise the portable job will reach for a Stan tool on
# Windows and macOS.

jobs:
  transpile:
    name: transpile (no Stan toolchain)
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken cell used to cancel the other eight, so a single genuine
      # failure arrived as nine notifications and the real cause was buried
      # among eight `cancelled` cells with no failing step recorded. Matches
      # DynamicObjects.jl.
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      # `julia-buildpkg` instantiates the PACKAGE project (`.`), not `test/`.
      # The suite runs out of `test/Project.toml` (TestItemRunner lives there),
      # so that env needs its own instantiate with the package developed into
      # it — the same invocation used locally.
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run tests that need no Stan build
        run: julia --project=test -e 'include("test/runtests.jl")' -- --skip-tag=bridgestan --skip-tag=stanc

  stan:
    name: stan (BridgeStan toolchain)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1']

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      # `instantiate` compiles each model through BridgeStan's Makefile, which
      # builds Stan's objects under `~/.bridgestan` on first use. Caching that
      # directory is what turns a cold multi-minute Stan build into a warm one.
      # The schema token is deliberate: BridgeStan only validates the cached
      # Makefile, so an older incomplete cache can look installed while lacking
      # `bin/stanc`. Bump the token whenever this cache contract changes.
      - name: Cache BridgeStan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.bridgestan
          key: bridgestan-v3-${{ runner.os }}-${{ hashFiles('Project.toml') }}
          restore-keys: bridgestan-v3-${{ runner.os }}-
      - name: Download BridgeStan
        run: julia --project=test -e 'using BridgeStan; path = BridgeStan.get_bridgestan_path(; download=true); stanc = joinpath(path, "bin", "stanc"); isfile(stanc) || run(`make -C $path bin/stanc`); isfile(stanc) || error("BridgeStan setup has no stanc binary at $stanc"); open(ENV["GITHUB_ENV"], "a") do io; println(io, "BRIDGESTAN=", path); println(io, "STANC_PATH=", stanc); end; println(path)'
      # Compiled models land in `tmp/<hash(stan_code)>.stan` + its shared
      # library, keyed by a hash of the GENERATED SOURCE — so a model whose Stan
      # is unchanged reuses its build across runs. Partial hits are the norm and
      # are still worth having; the key is per-run so each run refreshes it.
      - name: Cache compiled Stan models
        uses: actions/cache@v4
        with:
          path: tmp
          key: stanmodels-${{ runner.os }}-${{ matrix.julia-version }}-${{ github.sha }}
          restore-keys: stanmodels-${{ runner.os }}-${{ matrix.julia-version }}-
      - name: Run Stan-toolchain tests
        run: julia --project=test -e 'include("test/runtests.jl")'
