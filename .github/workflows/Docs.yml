name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      # The active branch, and now the one that PUBLISHES: `deploydocs` has
      # `devbranch = "devibe"` as of decision `0xyqj00`. It had been `dev`,
      # which had fallen 217 commits behind, so the published docs were stale
      # by that much. `devurl` is still "dev", so the URL (`gh-pages/dev/`)
      # and the root redirect are unchanged — only the source branch moved.
      - devibe
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
