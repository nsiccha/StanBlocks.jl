name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      # The active branch (217 commits ahead of `dev`). `deploydocs` has
      # `devbranch = "dev"`, so a `devibe` run BUILDS but skips deployment —
      # deliberate: it catches doc-build breakage on the branch work actually
      # lands on, without silently re-pointing what `gh-pages/dev/` publishes.
      # Whether `devbranch` should move to `devibe` is decision `1t5p8ee`.
      - devibe
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
